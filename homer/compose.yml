services:
  homer:
    image: b4bz/homer:latest
    container_name: homer
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      INIT_ASSETS: 0
    volumes:
      - ./assets:/www/assets:ro
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.homer.rule=Host(`status.danielsteman.com`)"
      - "traefik.http.routers.homer.entrypoints=https"
      - "traefik.http.routers.homer.tls=true"
      - "traefik.http.routers.homer.tls.certresolver=cloudflare"
      - "traefik.http.services.homer.loadbalancer.server.port=8080"
      - "traefik.http.routers.homer-insecure.rule=Host(`status.danielsteman.com`)"
      - "traefik.http.routers.homer-insecure.entrypoints=http"
      - "traefik.http.routers.homer-insecure.middlewares=redirect-to-https"
      - "traefik.docker.network=proxy"

networks:
  proxy:
    external: true
