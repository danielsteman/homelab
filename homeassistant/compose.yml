version: "3.3"
services:
  #######################################################
  #  Traefik Reverse Proxy
  #######################################################
  traefik:
    image: traefik:v3.6
    container_name: traefik
    restart: unless-stopped
    command:
      - "--log.level=INFO"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entryPoints.http.address=:80"
      - "--entryPoints.https.address=:443"
      - "--entryPoints.https.http.tls=true"
      # --- ACME Config (Cloudflare DNS challenge) ---
      # Still used by other services (e.g. chat.danielsteman.com via Mattermost).
      - "--certificatesresolvers.cloudflare.acme.dnschallenge.provider=cloudflare"
      - "--certificatesresolvers.cloudflare.acme.dnschallenge.resolvers=1.1.1.1:53"
      - "--certificatesresolvers.cloudflare.acme.email=me@danielsteman.com"
      - "--certificatesresolvers.cloudflare.acme.storage=/letsencrypt/acme.json"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./letsencrypt:/letsencrypt
    networks:
      - proxy
    environment:
      - CLOUDFLARE_DNS_API_TOKEN=${CF_API_TOKEN}

  #######################################################
  #  Cloudflare Tunnel (cloudflared)
  #  Routes homelab.danielsteman.com -> traefik:80 over an outbound tunnel.
  #  No inbound ports need to be forwarded on the router for HA.
  #######################################################
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    command: tunnel --config /etc/cloudflared/config.yml run
    volumes:
      - ./cloudflared:/etc/cloudflared:ro
    networks:
      - proxy
    depends_on:
      - traefik

  #######################################################
  #  Home Assistant
  #######################################################
  homeassistant:
    image: "ghcr.io/home-assistant/home-assistant:stable"
    container_name: homeassistant
    restart: unless-stopped
    networks:
      - proxy
    environment:
      - HASSIO_CONFIG=/config
    volumes:
      - ./config:/config
      - /etc/localtime:/etc/localtime:ro
      - /run/dbus:/run/dbus:ro
    devices:
      - /dev/ttyUSB0:/dev/ttyUSB0
    labels:
      - "traefik.enable=true"
      # TLS is terminated at the Cloudflare edge; the tunnel reaches Traefik over plain http on the proxy network.
      - 'traefik.http.routers.homeassistant.rule=Host(`homelab.danielsteman.com`)'
      - "traefik.http.routers.homeassistant.entrypoints=http"
      - "traefik.http.services.homeassistant.loadbalancer.server.port=8123"

networks:
  proxy:
    external: true
